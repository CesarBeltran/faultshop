<!DOCTYPE html>
<html lang="en">
<head>

    h1 { font-size: 2.5rem; color: #ffd700; margin-bottom: 1rem; }

    <input type="hidden" name="recipient" value="pedro">

  <script>
    document.getElementById('csrf').submit();
