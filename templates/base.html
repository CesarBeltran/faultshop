<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FaultShop{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo">Fault<span>Shop</span></a>
    <form action="/search" method="GET" class="search-bar">
      <input type="text" name="q" placeholder="Search products...">
      <button type="submit">Search</button>
    </form>
    <div class="nav-links">
      {% if user %}
        <span class="nav-user">{{ user.username }}</span>
        <a href="/dashboard" class="btn btn-ghost">My orders</a>
        <a href="/invoices" class="btn btn-ghost">Invoices</a>
        <a href="/my-account" class="btn btn-ghost">My account</a>
        {% if user.role == 'admin' %}
          <a href="/admin" class="btn btn-admin">Admin</a>
        {% endif %}
        <a href="/logout" class="btn btn-outline">Sign out</a>
      {% else %}
        <a href="/login" class="btn btn-ghost">Sign in</a>
        <a href="/register" class="btn btn-primary">Sign up</a>
      {% endif %}
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <p>&copy; 2026 FaultShop &mdash; <span>Practice environment. Do not use real data.</span></p>
  </footer>
</body>
</html>
