{% extends "base.html" %}
{% block title %}FaultShop - Sign in{% endblock %}
{% block content %}
<div class="page-center">
  <div class="card">
    <h2>Sign in</h2>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" placeholder="your username" required>
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
      <button type="submit" class="btn btn-primary full-width" style="margin-top:1.1rem">Sign in</button>
    </form>
    <p class="card-footer">No account? <a href="/register">Sign up</a></p>
    <p class="card-footer"><a href="/reset-password">Forgot my password</a></p>
    <hr style="margin:1.2rem 0;border:none;border-top:1px solid var(--border)">
    <p style="font-size:.78rem;color:var(--muted);text-align:center;margin-bottom:.6rem">Ethical hacking practice environment</p>
    <a href="/setup" class="btn btn-outline full-width" style="display:block;text-align:center">
      Reset lab
    </a>
  </div>
</div>
{% endblock %}
