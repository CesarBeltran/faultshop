{% extends "base.html" %}
{% block title %}FaultShop - Upload file{% endblock %}
{% block content %}
<div class="page-center">
  <div class="card">
    <h2>Upload product image</h2>
    {% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}
    <form method="POST" enctype="multipart/form-data">
      <label>Select file</label>
      <input type="file" name="file" required>
      <button type="submit" class="btn btn-primary full-width" style="margin-top:1.1rem">Upload</button>
    </form>
    <a href="/dashboard" class="btn btn-outline" style="margin-top:.9rem;display:inline-block">Back</a>
  </div>
</div>
{% endblock %}
